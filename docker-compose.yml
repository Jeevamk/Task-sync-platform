# Local development stack: PostgreSQL and n8n.
# Run the NestJS API on your machine with `npm run start:dev`.
# (Redis was removed in Step 2: the outbox table + waitUntil/Cron replace the queue, so the same code runs on Vercel.)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasksync
      POSTGRES_PASSWORD: tasksync_dev_password
      POSTGRES_DB: tasksync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksync"]
      interval: 5s
      retries: 10

  n8n:
    # Pin an exact version before production, e.g. docker.n8n.io/n8nio/n8n:<version>
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: tasksync
      DB_POSTGRESDB_PASSWORD: tasksync_dev_password
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Lets the WF1 Code node verify the event signature with Node's crypto module
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    extra_hosts:
      # Lets n8n call the API on your machine: http://host.docker.internal:3000
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
